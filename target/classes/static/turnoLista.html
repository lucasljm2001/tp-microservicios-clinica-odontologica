<!DOCTYPE html>
<html lang="es">
<head>
    <title>Lista de Turnos</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="js/get_Turno.js"></script>
</head>
<body>
<div class="container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Clinica</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pacienteLista.html">Pacientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="odontologoLista.html">Odontólogos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="turnoLista.html">Turnos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="div_turno_table">
        <h1>Lista de Turnos <button id="btn_add" class="btn btn-success btn-sm" title="Agregar Turno" >+</button></h1>
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="search_nombre" class="form-control" placeholder="Buscar por paciente" aria-label="Buscar por paciente">
                    <button class="btn btn-outline-secondary" type="button" id="btn_search">Buscar</button>
                    <button class="btn btn-outline-secondary" type="button" id="btn_search_clear">Limpiar</button>
                </div>
            </div>
        </div>
        <div class="row col-md-10 table-responsive">
            <table id="turnoTable" class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Fecha</th>
                    <th>Paciente</th>
                    <th>Odontologo</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="turnoTableBody">

                </tbody>
            </table>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-6" style="display: none; background-color:#e6fffa; padding:10px; border-radius:3px" id="div_turno_updating">
            <form id="update_turno_form">
                <div class="form-group">
                    <label>Id:</label>
                    <input type="text" class="form-control" id="turno_id" readonly>
                </div>
                <div class="form-group">
                    <label>Fecha y hora:</label>
                    <input type="date" class="form-control" id="fechaHora" required>
                </div>

                <h5>Paciente</h5>
                <div class="form-group">
                    <label>Id Paciente:</label>
                    <input type="number" class="form-control" id="paciente_id" placeholder="Id del paciente" required>
                </div>
                <div class="form-group">
                    <label>Nombre Paciente (opcional):</label>
                    <input type="text" class="form-control" id="paciente_nombre" readonly>
                </div>

                <h5>Odontólogo</h5>
                <div class="form-group">
                    <label>Id Odontologo:</label>
                    <input type="number" class="form-control" id="odontologo_id" placeholder="Id del odontologo" required>
                </div>
                <div class="form-group">
                    <label>Nombre Odontologo (opcional):</label>
                    <input type="text" class="form-control" id="odontologo_nombre" readonly>
                </div>

                <button type="submit" class="btn btn-primary">Modificar</button>
            </form>
            <div id="response" style="display:none; margin:10px"></div>
        </div>
    </div>
    <hr>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
